[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
dynamic = ["version"]
name = "pictag"
dependencies = [
    "Flask",
    "torch",
    "torchvision",
    "Pillow",
    "werkzeug",
]
requires-python = ">= 3.10"

[tool.setuptools.packages.find]
where = ["src"]
